# Single source of truth for Phase 1. Every threshold here is frozen BEFORE any
# model is trained; changing a value after seeing model results must be
# reported as exploratory in the report.
seed: 42

data:
  base_dir: data
  url: https://storage.googleapis.com/download.tensorflow.org/data/mini_speech_commands.zip
  zip_sha256: "49650f2341b26d886b46b3f4fb8fed59e30300b17550f1ee4a768b3106cf93a0"
  expected_classes: ["down", "go", "left", "no", "right", "stop", "up", "yes"]   # quoted on purpose: bare no/yes are parsed as booleans by YAML
  expected_files_per_class: 1000
  expected_sample_rate: 16000

audit:
  target_len_samples: 16000   # 1 s @ 16 kHz (the length used for padding/cropping in Phase 2)
  clip_threshold: 0.99        # |x| >= threshold counts as a clipped sample
  clipped_file_frac: 0.01     # a file is "clipped" if >1% of its samples are clipped
  very_short_sec: 0.5         # files shorter than this are flagged "very short"
  frame_len: 400              # 25 ms @ 16 kHz, used for the frame-dynamics descriptor
  frame_hop: 160              # 10 ms
  # --- low-energy handling -------------------------------------------------------------
  # low_energy_rms_dbfs only sets the DESCRIPTIVE flag `Low_Energy`. Files are excluded for
  # low energy only if exclude_low_energy is true, which is decided by the blinded listening
  # test (python -m src.energy_review score) using the rule frozen below, never by hand.
  low_energy_rms_dbfs: -60.0
  exclude_low_energy: true
  low_energy_sweep_dbfs: [-40.0, -50.0, -60.0, -70.0]

energy_review:                # blinded listening test (Phase 1, step 5) -- FROZEN BEFORE LISTENING
  seed: 42
  bin_edges_dbfs: [-70.0, -60.0, -50.0, -40.0, -30.0]   # bins: <-70, -70..-60, -60..-50, -50..-40, -40..-30, >=-30 (last bin = control)
  n_per_bin: 6
  peak_normalize_to: 0.7      # every clip is peak-normalised so loudness is not a cue
  unusable_rate_threshold: 0.5   # a bin is "unusable" if >= 50% of its clips are not recognised as the labelled word
  control_max_unusable_rate: 0.2 # if the control bin exceeds this, the listening protocol is invalid and must be repeated
  out_dir: data/energy_review

split:
  ratios: {train: 0.8, val: 0.1, test: 0.1}   # ratios of FILES, assigned at SPEAKER level
  out_dir: configs/splits

eda:
  n_samples_per_class: 3
  n_fft: 400
  hop_length: 160
  n_mels: 64
  fmax: 8000

paths:
  audit_csv: data/audit_table.csv
  figures_dir: figures/phase1
  tables_dir: reports/phase1/tables
  summary_json: reports/phase1/audit_summary.json
  listening_json: reports/phase1/listening_summary.json

# ======================================================================================
# Phase 2 -- data preparation, feature engineering, pattern discovery.
# EVERYTHING BELOW IS FROZEN BEFORE THE FIRST PHASE-2 RUN (commit "phase2: freeze config").
# The test split is never read in Phase 2 unless `python main_phase2.py --include-test` is
# used, and no analysis in the Phase-2 report uses it.
# ======================================================================================
phase2:
  seed: 42
  sr: 16000
  target_len: 16000            # 1 s. shorter clips: zero-padded at the END; longer: first 1 s kept (crop)
  features:
    n_fft: 400                 # 25 ms window
    hop: 160                   # 10 ms hop
    n_mfcc: 13
    n_mels_mfcc: 40            # mel bands feeding the DCT of the MFCCs
    n_mels_logmel: 64          # log-mel for the Phase-3 CNN (same as the Phase-1 EDA)
    fmin: 0
    fmax: 8000
    delta_width: 9
    active_thresh_db: 35       # a frame is "active" if its level is within 35 dB of the clip's loudest frame
    rolloff_pct: 0.85
    f0: {fmin: 70, fmax: 400, frame_length: 1024}
    low_band_hz: 1000          # energy-ratio feature: < 1 kHz vs > 4 kHz
    high_band_hz: 4000
    max_feature_corr: 0.95     # engineered features correlated above this (train, Spearman) are reported as redundant
  augmentation:                # TRAIN ONLY. one augmented copy per train clip
    gain_db: [-6.0, 6.0]       # uniform
    shift_ms: [-100, 100]      # uniform, zero fill
    noise_prob: 0.5            # probability that noise is added
    noise_types: [white, pink, babble]
    noise_snr_db: [5.0, 10.0, 20.0]   # one drawn uniformly
    babble_n: 6                # babble = sum of 6 other clips of the SAME split
  noise_conditions:            # VAL ONLY (diagnostic); fixed seed
    types: [white, pink, babble]
    snr_db: [20.0, 10.0, 5.0, 0.0]
  discovery:
    pca_components_for_clustering: 10
    umap: {n_neighbors: 15, min_dist: 0.1, metric: euclidean}
    k_range: [2, 16]
    k_selection_rule: "argmax silhouette over k_range (k-means, standard scaling, PCA-10); stability reported alongside"
    stable_ari_threshold: 0.8   # a pattern is called "stable" only if mean pairwise ARI >= 0.8
    n_seeds: 10
    n_subsamples: 10
    subsample_frac: 0.8
    min_clips_per_speaker_group: 8   # speakers with fewer train clips are not used as colour groups
    n_speaker_groups_plot: 8         # largest speakers shown as anonymous letters A..H
    silhouette_sample: 4000          # silhouette on a fixed random subsample for speed
  paths:
    features_dir: data/features
    figures_dir: figures/phase2
    tables_dir: reports/phase2/tables
    summary_json: reports/phase2/phase2_summary.json
